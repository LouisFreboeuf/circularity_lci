name: Build

on:
  push:
    branches: [main, "vibe/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and check package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests -v

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package metadata
        run: twine check dist/*

      - name: Install wheel in a clean venv and import
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/python -c "import circularity_lci; print('circularity_lci OK')"
          /tmp/venv/bin/python -c "import circularitylci; print('circularitylci OK')"

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
